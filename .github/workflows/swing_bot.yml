name: NASDAQ Swing Bot

on:
  schedule:
    # GitHub Actions uses UTC. 08:00–21:55 UTC covers both EST/EDT;
    # the Python bot itself checks America/New_York market hours.
    - cron: "*/5 8-21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nasdaq-swing-bot
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run one market scan
        env:
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DATABASE_PATH: alerts.db
          TICKER_CACHE_FILE: nasdaq_tickers.json
        run: python main.py --once

      - name: Upload bot state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-state-${{ github.run_id }}
          path: |
            alerts.db
            nasdaq_tickers.json
          if-no-files-found: ignore
          retention-days: 7
