name: NASDAQ NYSE Swing Bot

on:
  schedule:
    # New York time: 04:00-16:00, Monday-Friday, every 5 minutes.
    # 04:00-09:25 = pre-market
    # 09:30-16:00 = regular session
    - cron: "*/5 4-15 * * 1-5"
      timezone: "America/New_York"
    - cron: "0 16 * * 1-5"
      timezone: "America/New_York"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: swing-bot
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run one swing scan
        env:
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DATABASE_PATH: alerts.db
          TICKER_CACHE_FILE: nasdaq_tickers.json
        run: |
          python main.py --once

      - name: Persist bot state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git pull --rebase origin main

          git add alerts.db

          if [ -f nasdaq_tickers.json ]; then
            git add nasdaq_tickers.json
          fi

          if git diff --cached --quiet; then
            echo "No bot state changes to commit."
          else
            git commit -m "Update bot state"
            git push origin main
          fi
