name: NASDAQ Swing Bot

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC. These windows cover roughly 04:00–20:00
    # New York time across EST/EDT; the Python bot makes the final
    # America/New_York market-session decision.
    - cron: "*/5 8-23 * * 1-5"
    - cron: "*/5 0-1 * * 2-6"

permissions:
  contents: read

concurrency:
  group: nasdaq-swing-bot
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # GitHub-hosted runners are ephemeral. Restore SQLite + ticker cache so
      # cooldowns, open signals, Gemini daily usage and the SEC universe survive
      # between 5-minute scans.
      - name: Restore bot state
        uses: actions/cache/restore@v4
        with:
          path: |
            alerts.db
            nasdaq_tickers.json
          key: bot-state-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            bot-state-${{ github.ref_name }}-

      - name: Run one scan
        env:
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DATABASE_PATH: alerts.db
          TICKER_CACHE_FILE: nasdaq_tickers.json
        run: python main.py --once

      - name: Save bot state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            alerts.db
            nasdaq_tickers.json
          key: bot-state-${{ github.ref_name }}-${{ github.run_id }}

      - name: Upload state snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-state-${{ github.run_id }}
          path: |
            alerts.db
            nasdaq_tickers.json
          if-no-files-found: ignore
          retention-days: 7
